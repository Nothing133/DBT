version: 2

sources:
  - name: PSQLSOURCE
    database: RSMIGRATION
    schema: STAGING_PSQL
    tables:
      - name: ACCOUNT_ACCOUNT
        description: "Description of your table"
        columns:
          - name: ID
            tests:
              - not_null
          - name: DEPRECATED
            tests:
              - accepted_values:
                  values: ['true','false']


      - name: ACCOUNT_ACCOUNT_ACCOUNT_TAG
        description: "Description of another table"
        columns:
          - name: ACCOUNT_ACCOUNT_TAG_ID
            tests:
              - not_null
          - name: ACCOUNT_ACCOUNT_ID
            tests:
              - not_null
                  


      - name: ACCOUNT_ACCOUNT_TAG
        description: "Description of another table"
        columns:
          - name: CREATE_UID
            tests:
                - accepted_values:
                     values: ['1']
                     config:
                       where: "ID = 1"
          - name: WRITE_UID
            tests:
                - accepted_values:
                     values: ['1']
          - name: ID
            tests:
                - unique
                - not_null
                
                
 